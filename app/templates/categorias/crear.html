{% extends "layouts/base.html" %}
{% block extra_styles %}
<link rel="stylesheet" href="/static/css/categorias.css">
{% endblock %}

{% block content %}


<div class="page-header">

    <div>

        <h2>Nueva Categoría</h2>

        <p>Configura un nuevo tipo de activo.</p>

    </div>

</div>

<form action="/categorias/crear" method="post">

<div class="card-panel">

    <div class="row">

        <div class="col-md-6 mb-3">

            <label>Nombre</label>

            <input
                type="text"
                class="form-control"
                name="nombre"
                required
            >

        </div>

        <div class="col-md-6 mb-3">

            <label>Prefijo</label>

            <input
                type="text"
                maxlength="5"
                class="form-control"
                name="prefijo"
                placeholder="PC"
                required
            >

        </div>

        <div class="col-12 mb-3">

            <label>Descripción</label>

            <textarea
                class="form-control"
                rows="3"
                name="descripcion"></textarea>

        </div>

        <div class="col-md-6 mb-3">

            <label>Ícono Bootstrap</label>

            <input
                type="text"
                class="form-control"
                name="icono"
                value="bi-pc-display"
            >

        </div>

        <div class="col-md-6 mb-3">

            <label>Color</label>

            <input
                type="color"
                class="form-control form-control-color"
                name="color"
                value="#00E5FF"
            >

        </div>

    </div>

    <hr>

    <h5>Opciones</h5>

    <div class="row">

        <div class="col-md-3">

            <div class="form-check form-switch">

                <input
                    class="form-check-input"
                    type="checkbox"
                    name="permite_prestamo"
                    checked
                >

                <label>

                    Permite préstamo

                </label>

            </div>

        </div>

        <div class="col-md-3">

            <div class="form-check form-switch">

                <input
                    class="form-check-input"
                    type="checkbox"
                    name="requiere_firma"
                >

                <label>

                    Requiere firma

                </label>

            </div>

        </div>

        <div class="col-md-3">

            <div class="form-check form-switch">

                <input
                    class="form-check-input"
                    type="checkbox"
                    name="requiere_mantenimiento"
                >

                <label>

                    Lleva mantenimiento

                </label>

            </div>

        </div>

        <div class="col-md-3">

            <div class="form-check form-switch">

                <input
                    class="form-check-input"
                    type="checkbox"
                    name="requiere_protocolo"
                >

                <label>

                    Protocolo tecnológico

                </label>

                <small class="d-block text-muted">
                    Mostrar y exigir aceptación al entregar.
                </small>

            </div>

        </div>

        <div class="col-md-3">

            <div class="form-check form-switch">

                <input
                    class="form-check-input"
                    type="checkbox"
                    name="genera_qr"
                    checked
                >

                <label>

                    Generar QR

                </label>

            </div>

        </div>

    </div>

    <div class="row mt-3">

        <div class="col-md-3">

            <div class="form-check form-switch">

                <input
                    class="form-check-input"
                    type="checkbox"
                    name="genera_codigo_barras"
                    checked
                >

                <label>

                    Código de barras

                </label>

            </div>

        </div>

    </div>

    <hr>

    <button class="btn btn-info">

        <i class="bi bi-save"></i>

        Guardar Categoría

    </button>

    <a
        href="/categorias"
        class="btn btn-secondary">

        Cancelar

    </a>

</div>

</form>

{% endblock %}
