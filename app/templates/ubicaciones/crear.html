{% extends "layouts/base.html" %}

{% block content %}

<link rel="stylesheet" href="/static/css/forms.css">

<div class="page-header">

    <div>

        <h1>Nueva Ubicación</h1>

        <p>Registrar una nueva ubicación del colegio.</p>

    </div>

</div>

<div class="card-panel">

<form
    action="/ubicaciones/crear"
    method="post"
>

<div class="row">

    <div class="col-md-6 mb-3">

        <label>Nombre *</label>

        <input
            type="text"
            name="nombre"
            class="form-control"
            placeholder="Ej: Aula 203"
            required
        >

    </div>

    <div class="col-md-3 mb-3">

        <label>Código *</label>

        <input
            type="text"
            name="codigo"
            class="form-control"
            placeholder="203"
            required
        >

    </div>

    <div class="col-md-3 mb-3">

        <label>Curso</label>

        <input
            type="text"
            name="curso"
            class="form-control"
            placeholder="203"
        >

    </div>

</div>


<div class="row">

    <div class="col-md-4 mb-3">

        <label>Sede *</label>

        <select
            name="sede"
            class="form-select"
            required
        >

            <option value="Santa Teresa">

                Santa Teresa

            </option>

            <option value="San José">

                San José

            </option>

        </select>

    </div>

    <div class="col-md-4 mb-3">

        <label>Tipo</label>

        <input
            type="text"
            name="tipo"
            class="form-control"
            list="tipos"
            required
        >

        <datalist id="tipos">
            <option value="Bodega">
            <option value="Aula">
            <option value="Laboratorio">
            <option value="Biblioteca">
            <option value="Oficina">
            <option value="Sala de Profesores">
            <option value="Auditorio">
            <option value="Cancha">
        </datalist>

    </div>

    <div class="col-md-4 mb-3">

        <label>Piso</label>

        <input
            type="text"
            name="piso"
            class="form-control"
            placeholder="1"
        >

    </div>

</div>


<div class="mb-3">

    <label>Descripción</label>

    <textarea
        name="descripcion"
        class="form-control"
        rows="4"
        placeholder="Información adicional de la ubicación"
    ></textarea>

</div>


<div class="form-check mb-4">

    <input

        class="form-check-input"

        type="checkbox"

        name="activo"

        checked

    >

    <label class="form-check-label">

        Ubicación activa

    </label>

</div>


<div class="d-flex gap-3">

    <button
        type="submit"
        class="btn-primary"
    >

        <i class="bi bi-check-circle"></i>

        Guardar Ubicación

    </button>

    <a
        href="/ubicaciones"
        class="btn-secondary"
    >

        Cancelar

    </a>

</div>

</form>

</div>

{% endblock %}
