{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="row justify-content-center vh-100 align-items-center">

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="text-center mb-4">

                        Stock de Inventario

                    </h3>

                    {% if error %}

                    <div class="alert alert-danger">

                        {{ error }}

                    </div>

                    {% endif %}

                    <form method="post" action="/login">

                        <div class="mb-3">

                            <label>Usuario</label>

                            <input
                                class="form-control"
                                name="usuario"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Contraseña</label>

                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                required>

                        </div>

                        <button class="btn btn-primary w-100">

                            Iniciar sesión

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
