{% extends "layouts/base.html" %}

{% block extra_styles %}
<link rel="stylesheet" href="/static/css/activos.css">
{% endblock %}

{% block content %}



<div class="page-header">

    <div>

        <h1>Nuevo Activo</h1>

        <p>Registrar uno o varios activos.</p>

    </div>

</div>

<div class="card-panel">

<form
    method="POST"
    action="/activos/crear"
>

<div class="form-grid">

    <!-- Nombre -->

    <div class="form-group">

        <label>

            Nombre *

        </label>

        <input
            type="text"
            name="nombre"
            required
        >

    </div>

    {% if puede_ver_areas %}
    <div class="form-group">
        <label>Inventario / Área *</label>
        <select name="area" required>
            <option value="Medios" {% if area_inicial == "Medios" %}selected{% endif %}>Medios</option>
            <option value="Logística" {% if area_inicial == "Logística" %}selected{% endif %}>Logística</option>
        </select>
    </div>
    {% endif %}

    <!-- Categoria -->

    <div class="form-group">

        <label>

            Categoría *

        </label>

        <select
            name="categoria_id"
            required
        >

            <option value="">

                Seleccione...

            </option>

            {% for categoria in categorias %}

            <option
                value="{{ categoria.id }}"
            >

                {{ categoria.nombre }}

            </option>

            {% endfor %}

        </select>

    </div>


    <!-- Marca -->

    <div class="form-group">

        <label>

            Marca

        </label>

        <input
            type="text"
            name="marca"
        >

    </div>


    <!-- Modelo -->

    <div class="form-group">

        <label>

            Modelo

        </label>

        <input
            type="text"
            name="modelo"
        >

    </div>


    <!-- Cantidad -->

    <div class="form-group">

        <label>

            Cantidad *

        </label>

        <input
            type="number"
            name="cantidad"
            min="1"
            value="1"
            required
        >

    </div>


    <!-- Ubicación -->

    <div class="form-group">

        <label>

            Ubicación Inicial *

        </label>

        <select
            name="ubicacion_id"
            required
        >
            <option value="">Seleccione una bodega...</option>

            {% for ubicacion in ubicaciones %}

            <option
                value="{{ ubicacion.id }}"
                data-area="{{ ubicacion.area }}"
            >

                {{ ubicacion.nombre }}

            </option>

            {% endfor %}

        </select>

    </div>


    <!-- Estado -->

    <div class="form-group">

        <label>

            Estado

        </label>

        <select
            name="estado"
        >

            <option value="Disponible">Disponible</option>
            <option value="Prestado">Prestado</option>
            <option value="Mantenimiento">Mantenimiento

            <option value="Baja">Baja</option>

        </select>

    </div>


    <!-- Observaciones -->

    <div class="form-group full">

        <label>

            Observaciones

        </label>

        <textarea

            name="observaciones"

            rows="4"

        ></textarea>

    </div>

</div>


<div class="form-actions">

    <a
        href="/activos"
        class="btn-secondary"
    >

        Cancelar

    </a>

    <button
        class="btn-primary"
        type="submit"
    >

        <i class="bi bi-check-circle"></i>

        Guardar Activos

    </button>

</div>

</form>

</div>
<script>
(() => {
  const areaSelect = document.querySelector('select[name="area"]');
  const locationSelect = document.querySelector('select[name="ubicacion_id"]');
  if (!locationSelect) return;
  const filterLocations = () => {
    const chosenArea = areaSelect ? areaSelect.value : {{ area_inicial | tojson }};
    let selectedVisible = false;
    [...locationSelect.options].forEach((option) => {
      if (!option.value) return;
      const visible = !option.dataset.area || option.dataset.area === chosenArea;
      option.hidden = !visible;
      option.disabled = !visible;
      if (visible && option.selected) selectedVisible = true;
    });
    if (!selectedVisible) {
      const first = [...locationSelect.options].find((option) => option.value && !option.disabled);
      locationSelect.value = first ? first.value : '';
    }
  };
  if (areaSelect) areaSelect.addEventListener('change', filterLocations);
  filterLocations();
})();
</script>

{% endblock %}
